# Usar junto de compose.yaml. Ver instruções de aplicação do SQL no README da API.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: whatsapp_scheduler
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  api:
    build: ./backend/whatsapp-scheduler-api/whatsapp-scheduler
    init: true
    restart: unless-stopped
    mem_limit: 512m
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/whatsapp_scheduler
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD}
      WHATSAPP_WORKER_URL: http://whatsapp-worker:3001
      WHATSAPP_WORKER_TOKEN: ${API_TOKEN:?Defina API_TOKEN}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SERVER_FORWARD_HEADERS_STRATEGY: ${SERVER_FORWARD_HEADERS_STRATEGY:-none}
      LOG_FILE: /tmp/api.log
      SCHEDULER_INTERVAL: ${SCHEDULER_INTERVAL:-30000}
      SCHEDULER_TOLERANCE_MINUTES: ${SCHEDULER_TOLERANCE_MINUTES:-30}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      whatsapp-worker:
        condition: service_started
    stop_grace_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  postgres-data:
