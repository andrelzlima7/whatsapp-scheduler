spring.application.name=whatsapp-scheduler
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=60s
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/whatsapp_scheduler}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.jackson.deserialization.fail-on-unknown-properties=true
logging.file.name=${LOG_FILE:./logs/api.log}
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=3
logging.logback.rollingpolicy.total-size-cap=20MB
app.admin.login=${ADMIN_LOGIN:admin}
app.admin.password=${ADMIN_PASSWORD:}
app.worker.url=${WHATSAPP_WORKER_URL:http://127.0.0.1:3001}
app.worker.token=${WHATSAPP_WORKER_TOKEN:}
app.scheduler.enabled=${SCHEDULER_ENABLED:true}
app.scheduler.interval=${SCHEDULER_INTERVAL:30000}
app.scheduler.tolerance-minutes=${SCHEDULER_TOLERANCE_MINUTES:30}
